name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: shellcheck + yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning
      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            srvcore/network srvcore/suricata/suricata-overrides.yaml .github

  suricata-rules:
    name: Validation des regles Suricata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: suricata -T sur local.rules
        run: |
          docker run --rm --entrypoint suricata \
            -v "$PWD/srvcore/suricata/local.rules:/tmp/local.rules:ro" \
            jasonish/suricata:latest \
            -T -S /tmp/local.rules -c /etc/suricata/suricata.yaml -l /tmp

  secrets:
    name: Detection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
