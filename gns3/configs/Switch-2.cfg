! Switch-2 (Cisco IOSvL2) - VLAN 20 Serveurs et Sauvegarde (192.168.20.0/24)
! Gi0/0 -> FortiGate port5 | Gi0/1 -> srvglpi | Gi0/2 -> srvzabbix | Gi0/3 -> srvcore | Gi1/0 -> srvbackup
hostname Switch-2
no ip domain-lookup
!
vlan 20
 name SERVEURS
!
interface range GigabitEthernet0/0 - 3 , GigabitEthernet1/0
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/0
 description Vers FortiGate port5 (passerelle VLAN 20)
interface GigabitEthernet0/1
 description srvglpi
interface GigabitEthernet0/2
 description srvzabbix
interface GigabitEthernet0/3
 description srvcore (DNS DHCP Proxy Mail NTP IDS)
interface GigabitEthernet1/0
 description srvbackup
!
interface Vlan20
 ip address 192.168.20.2 255.255.255.0
 no shutdown
ip default-gateway 192.168.20.254
!
! OPTIONNEL - miroir de port pour que Suricata (srvcore) voie le trafic des autres serveurs.
! Sur IOSvL2 (switch virtuel) le SPAN n'est pas garanti : tester avec `show monitor session 1`
! puis un ping entre srvglpi et srvzabbix capture sur srvcore (tcpdump -i ens33 icmp).
! Si le miroir ne fonctionne pas, Suricata reste un IDS "hote" : il analyse tout le trafic
! de srvcore lui-meme (DNS, DHCP, Proxy, Mail, SSH), ce qui correspond au deploiement du rapport.
!monitor session 1 source interface Gi0/1 - 2 , Gi1/0 both
!monitor session 1 destination interface Gi0/3
!
end
