! Router-1 (Cisco IOSv) - sortie Internet du lab, NAT vers NAT1 (GNS3)
! Gi0/0 -> NAT1 (Internet, DHCP)   |   Gi0/1 -> FortiGate port1 (transit 10.0.0.0/30)
hostname Router-1
no ip domain-lookup
!
interface GigabitEthernet0/0
 description Vers NAT1 - Internet
 ip address dhcp
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description Vers FortiGate port1 - transit
 ip address 10.0.0.1 255.255.255.252
 ip nat inside
 no shutdown
!
! Les reseaux internes sont traduits en sortie (PAT).
ip access-list standard NAT-INSIDE
 permit 10.0.0.0 0.0.0.3
 permit 192.168.10.0 0.0.0.255
 permit 192.168.20.0 0.0.0.255
!
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0 overload
!
! Routes de retour vers les reseaux internes via le FortiGate.
ip route 192.168.10.0 255.255.255.0 10.0.0.2
ip route 192.168.20.0 255.255.255.0 10.0.0.2
! La route par defaut est apprise par DHCP depuis NAT1.
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
