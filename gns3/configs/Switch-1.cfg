! Switch-1 (Cisco IOSvL2) - VLAN 10 Administration (192.168.10.0/24)
! Gi0/0 -> FortiGate port3 | Gi0/1 -> webterm-1 | Gi0/2 -> admin | Gi0/3 -> user
hostname Switch-1
no ip domain-lookup
!
vlan 10
 name ADMINISTRATION
!
interface range GigabitEthernet0/0 - 3
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/0
 description Vers FortiGate port3 (passerelle VLAN 10)
interface GigabitEthernet0/1
 description webterm-1
interface GigabitEthernet0/2
 description admin
interface GigabitEthernet0/3
 description user
!
! Interface de gestion du switch
interface Vlan10
 ip address 192.168.10.2 255.255.255.0
 no shutdown
ip default-gateway 192.168.10.254
!
end
