# FortiGate 7.0 (VM GNS3) - pare-feu perimetrique UITS lab.lan
# port1 -> Router-1 (transit) | port3 -> Switch-1 (VLAN 10) | port2 + port5 -> reseau serveurs (VLAN 20)
# port2 = Cloud1 (VMnet8 192.168.20.1/24), port5 = Switch-2 : regroupes dans un "software switch"
# afin que l'hote VMware (192.168.20.1) et les serveurs partagent le meme reseau 192.168.20.0/24.
# Coller dans la console telnet du FortiGate (admin, sans mot de passe au premier demarrage ;
# definir immediatement un mot de passe : `config system admin` > `edit admin` > `set password ...`).

config system global
    set hostname "FGT-UITS"
    set timezone 12
end

# --- Interfaces -------------------------------------------------------------
config system interface
    edit "port1"
        set alias "TRANSIT-ROUTER"
        set mode static
        set ip 10.0.0.2 255.255.255.252
        set allowaccess ping
        set role wan
    next
    edit "port3"
        set alias "VLAN10-ADMIN"
        set mode static
        set ip 192.168.10.254 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        # Relais DHCP vers le serveur DHCP de srvcore (VLAN 20)
        set dhcp-relay-service enable
        set dhcp-relay-ip "192.168.20.133"
    next
end

config system switch-interface
    edit "lan20"
        set vdom "root"
        set member "port2" "port5"
        set type switch
    next
end

config system interface
    edit "lan20"
        set alias "VLAN20-SERVEURS"
        set mode static
        set ip 192.168.20.254 255.255.255.0
        set allowaccess ping https ssh
        set role lan
    next
end

# --- Routage ------------------------------------------------------------------
config router static
    edit 1
        set gateway 10.0.0.1
        set device "port1"
    next
end

# --- Objets ---------------------------------------------------------------------
config firewall address
    edit "NET-ADMIN"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "NET-SERVEURS"
        set subnet 192.168.20.0 255.255.255.0
    next
    edit "SRVCORE"
        set subnet 192.168.20.133 255.255.255.255
    next
end

config firewall service custom
    edit "SURICATA-DASH"
        set tcp-portrange 5000
    next
    edit "SQUID-PROXY"
        set tcp-portrange 3128
    next
    edit "MAIL"
        set tcp-portrange 25 143 587 993
    next
end

# --- Politiques (moindre privilege, journalisation complete) -----------------
config firewall policy
    edit 1
        set name "ADMIN-vers-SERVEURS"
        set srcintf "port3"
        set dstintf "lan20"
        set srcaddr "NET-ADMIN"
        set dstaddr "NET-SERVEURS"
        set action accept
        set schedule "always"
        set service "PING" "SSH" "HTTP" "HTTPS" "DNS" "SURICATA-DASH" "SQUID-PROXY" "MAIL"
        set logtraffic all
    next
    edit 2
        set name "SERVEURS-vers-INTERNET"
        set srcintf "lan20"
        set dstintf "port1"
        set srcaddr "NET-SERVEURS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS" "NTP" "PING"
        set nat enable
        set logtraffic all
    next
    edit 3
        set name "ADMIN-vers-INTERNET"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "NET-ADMIN"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS" "PING"
        set nat enable
        set logtraffic all
    next
    edit 4
        set name "SERVEURS-vers-ADMIN-DENY"
        set srcintf "lan20"
        set dstintf "port3"
        set srcaddr "NET-SERVEURS"
        set dstaddr "NET-ADMIN"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
