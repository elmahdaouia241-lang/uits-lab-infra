# Parametres Suricata appliques dans /etc/suricata/suricata.yaml (extraits, valeurs du deploiement)

vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24,192.168.20.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

# Capture AF_PACKET sur l'interface reseau de srvcore
af-packet:
  - interface: ens33
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

# Journal d'evenements JSON lu par le dashboard et par l'agent Zabbix
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - dns
        - http
        - tls
        - ssh

default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules
  - local.rules
