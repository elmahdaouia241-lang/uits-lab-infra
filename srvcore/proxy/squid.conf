# /etc/squid/squid.conf - proxy Squid sur srvcore (extrait applique)
http_port 3128

acl lab_admin src 192.168.10.0/24
acl lab_servers src 192.168.20.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
http_access allow lab_admin
http_access allow lab_servers
http_access deny all

# Ne pas divulguer la version ni l'adresse du client
httpd_suppress_version_string on
forwarded_for delete
via off

cache_mem 64 MB
access_log /var/log/squid/access.log squid
