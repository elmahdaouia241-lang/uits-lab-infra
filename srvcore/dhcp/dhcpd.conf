# /etc/dhcp/dhcpd.conf - ISC DHCP sur srvcore
# Interface d'ecoute : INTERFACESv4="ens33" dans /etc/default/isc-dhcp-server
option domain-name "lab.lan";
option domain-name-servers 192.168.20.133;
default-lease-time 600;
max-lease-time 7200;
authoritative;

# VLAN 20 - Serveurs (les serveurs gardent leurs IP statiques, plage pour les invites)
subnet 192.168.20.0 netmask 255.255.255.0 {
    range 192.168.20.150 192.168.20.200;
    option routers 192.168.20.254;
}

# VLAN 10 - Administration (clients atteints via le relais DHCP du FortiGate, port3)
subnet 192.168.10.0 netmask 255.255.255.0 {
    range 192.168.10.100 192.168.10.200;
    option routers 192.168.10.254;
}
