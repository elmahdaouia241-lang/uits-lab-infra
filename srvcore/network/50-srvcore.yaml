# /etc/netplan/50-srvcore.yaml - srvcore (VLAN 20, Switch-2 Gi0/3)
# Appliquer : sudo netplan apply
network:
  version: 2
  renderer: networkd
  ethernets:
    ens33:
      dhcp4: false
      addresses: [192.168.20.133/24]
      routes:
        - to: default
          via: 192.168.20.254
      nameservers:
        addresses: [127.0.0.1, 8.8.8.8]
        search: [lab.lan]
