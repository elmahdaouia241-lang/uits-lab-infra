# /etc/zabbix/zabbix_agentd.d/suricata.conf - supervision de Suricata par Zabbix (srvcore)
# Nombre d'alertes Suricata sur les 5 dernieres minutes (cle : suricata.alerts.5m)
UserParameter=suricata.alerts.5m,jq -r --argjson t "$(( $(date +%s) - 300 ))" 'select(.event_type=="alert") | select((.timestamp|sub("\\.[0-9]+";"")|strptime("%Y-%m-%dT%H:%M:%S%z")|mktime) >= $t) | 1' /var/log/suricata/eve.json 2>/dev/null | wc -l
# Etat du service (1 = actif, 0 = arrete)
UserParameter=suricata.service.active,systemctl is-active --quiet suricata && echo 1 || echo 0
# Le fichier eve.json doit etre lisible par l'utilisateur zabbix :
#   sudo usermod -aG adm zabbix && sudo chmod 640 /var/log/suricata/eve.json (groupe adm)
